modules:
  - id: 0
    title: Introduction
    topics:
      - Course Introduction and How to Take this Course
    problem_set: null

  - id: 1
    title: Probability
    topics:
      - Review of basic concepts for random variables
      - Probability distributions common in finance
      - Expectation, variance, and covariance
      - Sums of random variables
      - Central Limit Theorem
    prereq_focus: [probability_and_statistics]
    textbook_refs: [CZ]
    problem_set: 1

  - id: 2
    title: Introduction to Discrete-Time Stochastic Processes
    topics:
      - The random walk and generalizations
      - Structure and solution of linear time series models
      - Monte Carlo methods, simulation
      - Testing the Random Walk Hypothesis
    prereq_focus: [probability_and_statistics, r_programming]
    textbook_refs: [Tsay, CZ]
    problem_set: 2

  - id: 3
    title: Time Series Models
    topics:
      - Model identification and estimation
      - Alternatives to the random walk
      - AR, MA, ARMA, RW generalizations
      - Order determination
      - Boundary value problems
      - "Applications: forecasting, gambling, dynamic trading strategies"
    prereq_focus: [probability_and_statistics, r_programming]
    textbook_refs: [Tsay]
    problem_set: 3

  - id: 4
    title: Introduction to Continuous-Time Stochastic Processes
    topics:
      - Limits of discrete-time processes
      - Scaling behavior
      - Brownian motion
      - Itô processes
      - Itô's lemma
    prereq_focus: [multivariable_calculus, probability_and_statistics]
    textbook_refs: [CZ]
    problem_set: 4

  - id: 5
    title: Itô Calculus
    topics:
      - Itô processes in finance
      - Dynamic hedging and risk management
      - The Black-Scholes-Merton equation
    prereq_focus: [multivariable_calculus]
    textbook_refs: [CZ]
    problem_set: 5

  - id: 6
    title: Continuous-Time Finance
    topics:
      - From SDE to PDE
      - Solving partial differential equations of finance
      - Boundary value problems and Green functions
      - Applications to derivative pricing and credit default risk
    prereq_focus: [multivariable_calculus]
    textbook_refs: [CZ]
    problem_set: 6

  - id: 7
    title: Linear Algebra of Asset Pricing
    topics:
      - Review of linear algebra
      - "One-period model: prices, payoffs, and probabilities"
      - Dual spaces and the FTAP
      - Linear algebra of portfolio space
    prereq_focus: [linear_algebra]
    textbook_refs: [CZ]
    problem_set: 7

  - id: 8
    title: Optimization
    topics:
      - Review of high-dimension critical points
      - Lagrange multipliers and constrained optimization
      - Quadratic programming solutions
      - Applications to portfolio optimization
    prereq_focus: [multivariable_calculus, linear_algebra]
    textbook_refs: [CZ]
    problem_set: 8

  - id: 9
    title: Optimal Decision Making and Optimal Strategies
    topics:
      - Dynamic programming
      - Variational methods
      - Extensions
      - "Applications: optimal execution and trading"
    prereq_focus: [linear_algebra, multivariable_calculus]
    textbook_refs: [CZ]
    problem_set: null  # no PS listed; covered on final

  - id: 10
    title: Review Period
    topics:
      - No new content — review for final exam
    problem_set: null
